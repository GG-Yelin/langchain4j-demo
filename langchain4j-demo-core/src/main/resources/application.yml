server:
  port: 8080

spring:
  application:
    name: langchain4j-demo

# LangChain4j Spring Boot Starter 配置
langchain4j:
  open-ai:
    chat-model:
      base-url: http://langchain4j.dev/demo/openai/v1
      api-key: demo
      model-name: gpt-4o-mini
      temperature: 0.7
      max-tokens: 2000
      timeout: 60s
      log-requests: true
      log-responses: true
    embedding-model:
      base-url: http://langchain4j.dev/demo/openai/v1
      api-key: demo
      model-name: text-embedding-3-small
      timeout: 60s

# MCP Server 配置 (HTTP/SSE 模式)
mcp:
  server:
    base-url: http://localhost:8081

# 日志配置
logging:
  level:
    org.example.langchain4jdemo: DEBUG
    dev.langchain4j: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'

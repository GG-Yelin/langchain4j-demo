server:
  port: 8081  # MCP Server 端口

spring:
  application:
    name: mcp-server
  main:
    # Web应用（HTTP/SSE模式）
    web-application-type: servlet

# MCP Server 配置
spring.ai.mcp.server:
  name: langchain4j-demo-mcp-server
  version: 1.0.0
  sse-message-endpoint: /mcp/message  # SSE 消息端点

# 工具配置
mcp:
  tools:
    filesystem:
      # 文件系统工具允许访问的根目录
      base-path: ${user.home}
    database:
      # 数据库连接配置（如果使用DatabaseTool）
      jdbc-url:
      username:
      password:

# 日志配置
logging:
  level:
    root: INFO
    org.example.mcpserver: DEBUG
    org.springframework.ai.mcp: DEBUG

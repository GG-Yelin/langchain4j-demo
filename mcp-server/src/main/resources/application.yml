spring:
  application:
    name: mcp-server
  ai:
    mcp:
      server:
        # MCP Server 基本配置
        name: langchain4j-demo-mcp-server
        version: 1.0.0
        # 使用 HTTP/SSE 传输
        stdio: false
        # 使用 STATELESS 协议
        protocol: STATELESS

server:
  port: 8081

logging:
  level:
    root: OFF
    org.example.mcpserver: OFF
    org.springframework: OFF
    org.springframework.ai: OFF
    org.springframework.ai.mcp: OFF
    org.springaicommunity.mcp: OFF
